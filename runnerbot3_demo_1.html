<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runners Errands — Runnerbot 3 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cambria&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A2A97; --navy-dark: #071D6B; --green: #38E500; --green-deep: #219600;
    --ink: #14161A; --muted: #767C88; --line: #ECEEF2; --amber: #9A5B13; --bg-soft: #FAFAFC;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E4E6EC; font-family: 'Inter', system-ui, sans-serif; display: flex; justify-content: center; padding: 26px 12px; }
  .display { font-family: 'Cambria', Georgia, serif; }

  .phone { width: 400px; max-width: 100%; background: white; border-radius: 36px; overflow: hidden; box-shadow: 0 30px 80px rgba(10,20,60,0.32); position: relative; height: 820px; display: flex; flex-direction: column; border: 1px solid #E8E9EE; }
  .status-bar { background: white; font-size: 11px; padding: 10px 22px 2px; display: flex; justify-content: space-between; font-weight: 600; color: var(--ink); }
  .app-header { padding: 6px 20px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .app-header .logo-dot { width: 32px; height: 32px; border-radius: 10px; background: var(--navy); display: flex; align-items: center; justify-content: center; }
  .app-header .logo-dot svg { width: 17px; height: 17px; }
  .app-header .brand .name { font-weight: 800; font-size: 14.5px; color: var(--ink); }
  .app-header .brand .tag { font-size: 10px; color: var(--muted); }
  .app-header .zone-pill { margin-left: auto; background: #EAF2ED; color: var(--green-deep); font-size: 9.5px; font-weight: 700; padding: 5px 10px; border-radius: 20px; }

  .app-body { flex: 1; overflow-y: auto; background: white; }

  /* ================= LANDING: CHAT-FIRST ================= */
  .landing { padding: 26px 22px 14px; display: flex; flex-direction: column; height: 100%; }
  .landing-greet { font-family: 'Cambria', serif; font-size: 25px; color: var(--ink); font-weight: 600; line-height: 1.25; margin-bottom: 6px; }
  .landing-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 22px; line-height: 1.55; }

  .big-input-wrap { background: var(--bg-soft); border: 1.5px solid var(--line); border-radius: 20px; padding: 14px 14px 12px; margin-bottom: 18px; transition: border-color 0.15s ease; }
  .big-input-wrap:focus-within { border-color: var(--green); }
  .big-input { width: 100%; border: none; background: transparent; font-family: 'Inter', sans-serif; font-size: 14.5px; color: var(--ink); resize: none; outline: none; min-height: 44px; }
  .big-input::placeholder { color: #B7BBC4; }
  .input-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .mic-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.12s ease; }
  .mic-btn:hover { transform: scale(1.06); }
  .mic-btn svg { width: 17px; height: 17px; }
  .send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .send-btn svg { width: 16px; height: 16px; }

  .examples-label { font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .examples-scroll { flex: 1; overflow-y: auto; }
  .ex-chip { display: inline-block; background: white; border: 1.3px solid var(--line); border-radius: 14px; padding: 10px 13px; margin: 0 8px 8px 0; font-size: 12px; color: var(--ink); cursor: pointer; transition: all 0.13s ease; }
  .ex-chip:hover { border-color: var(--green); background: #F5FCF2; }

  /* ================= CHAT VIEW ================= */
  .chat-view { display: none; flex-direction: column; height: 100%; }
  .chat-view.open { display: flex; }
  .chat-topbar { padding: 12px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .chat-topbar .back { font-size: 20px; color: var(--navy); cursor: pointer; padding: 2px 6px; }
  .chat-topbar .title { font-weight: 700; color: var(--ink); font-size: 14px; }
  .chat-topbar .sub { font-size: 10px; color: var(--muted); }

  .stage-track { display: flex; padding: 10px 18px 12px; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .stage-step { flex: 1; text-align: center; font-size: 8px; color: #C4C8D1; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2px; padding-top: 7px; border-top: 3px solid #EFF0F4; white-space: nowrap; min-width: 46px; }
  .stage-step.active { color: var(--green-deep); border-top-color: var(--green); }
  .stage-step.done { color: var(--navy); border-top-color: var(--navy); }

  .lang-row { display: flex; gap: 5px; padding: 10px 18px 0; flex-wrap: wrap; }
  .lang-btn { background: var(--bg-soft); color: var(--navy); border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px; font-size: 10px; cursor: pointer; }
  .lang-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
  .plain-toggle-row { display: flex; align-items: center; gap: 6px; padding: 8px 18px; font-size: 10px; color: var(--muted); }
  .p-switch { width: 26px; height: 14px; background: #DADFE8; border-radius: 8px; position: relative; cursor: pointer; }
  .p-switch .knob { width: 10px; height: 10px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left 0.15s ease; }
  .p-switch.on { background: var(--green); }
  .p-switch.on .knob { left: 14px; }
  .lang-draft-note { display: none; background: #FFF3E0; color: #7A5A12; font-size: 9px; padding: 6px 12px; margin: 0 18px 8px; border-radius: 8px; }
  .lang-draft-note.show { display: block; }

  .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: var(--bg-soft); }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; }
  .msg.bot { background: white; border: 1px solid var(--line); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--navy); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.typing { display: flex; gap: 4px; padding: 13px 15px; }
  .msg.typing span { width: 5px; height: 5px; border-radius: 50%; background: #B7BBC4; display: inline-block; animation: bounce 1.2s infinite; }
  .msg.typing span:nth-child(2) { animation-delay: 0.15s; }
  .msg.typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-3px); } }

  /* Intelligent Suggestion */
  .suggestion-card { background: #F5FCF2; border: 1px solid #CFEFC0; border-radius: 14px; padding: 11px 13px; align-self: stretch; display: flex; gap: 9px; }
  .suggestion-card .sg-icon { font-size: 16px; flex-shrink: 0; }
  .suggestion-card .sg-text { font-size: 12px; color: #1F5C0A; line-height: 1.5; }

  /* AI Planning card (checklist + time + cost) */
  .plan-card { background: white; border: 1.3px solid var(--line); border-radius: 16px; padding: 15px; align-self: stretch; }
  .plan-card .pl-title { font-size: 10px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 9px; }
  .plan-card .pl-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; color: var(--ink); }
  .plan-card .pl-item .ck { width: 17px; height: 17px; border-radius: 50%; background: var(--green); color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; }
  .plan-card .pl-meta { display: flex; gap: 20px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .plan-card .pl-meta-item .k { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
  .plan-card .pl-meta-item .v { font-family: 'Cambria', serif; font-size: 16px; color: var(--navy); font-weight: 600; margin-top: 1px; }

  /* Price card */
  .price-card { background: white; border: 1.3px solid var(--green); border-radius: 16px; padding: 14px; align-self: stretch; }
  .price-card .pc-title { font-size: 10px; font-weight: 700; color: var(--green-deep); text-transform: uppercase; margin-bottom: 8px; }
  .price-card .pc-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; color: var(--ink); }
  .price-card .pc-total { font-weight: 700; color: var(--navy); font-size: 15px; padding-top: 7px; margin-top: 5px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; }
  .price-card .pc-note { font-size: 9.5px; color: var(--muted); margin-top: 7px; font-style: italic; line-height: 1.4; }

  /* Live Order Timeline */
  .timeline-card { background: white; border: 1.3px solid var(--line); border-radius: 16px; padding: 15px; align-self: stretch; }
  .timeline-card .tl-title { font-size: 10px; font-weight: 700; color: var(--navy); text-transform: uppercase; margin-bottom: 12px; }
  .tl-row { display: flex; gap: 10px; padding-bottom: 14px; position: relative; }
  .tl-row:last-child { padding-bottom: 0; }
  .tl-row:not(:last-child)::before { content: ''; position: absolute; left: 8px; top: 20px; bottom: -4px; width: 2px; background: var(--line); }
  .tl-row.done:not(:last-child)::before { background: var(--green); }
  .tl-dot { width: 17px; height: 17px; border-radius: 50%; background: var(--line); flex-shrink: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
  .tl-row.done .tl-dot { background: var(--green); }
  .tl-row.active .tl-dot { background: var(--navy); }
  .tl-dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: white; }
  .tl-content .tl-label { font-size: 12.5px; font-weight: 600; color: #C4C8D1; }
  .tl-row.done .tl-content .tl-label, .tl-row.active .tl-content .tl-label { color: var(--ink); }
  .tl-content .tl-time { font-size: 10px; color: var(--muted); margin-top: 1px; }

  /* Live Map (SVG) */
  .map-card { background: white; border: 1.3px solid var(--line); border-radius: 16px; overflow: hidden; align-self: stretch; }
  .map-card .map-label { font-size: 10px; font-weight: 700; color: var(--navy); text-transform: uppercase; padding: 12px 14px 0; }
  .map-card .eta { font-size: 11px; color: var(--muted); padding: 2px 14px 10px; }

  /* Runner Profile */
  .runner-card { background: white; border: 1.3px solid var(--line); border-radius: 16px; padding: 14px; align-self: stretch; display: flex; gap: 12px; align-items: center; }
  .runner-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; font-family: 'Cambria', serif; font-weight: 700; font-size: 17px; flex-shrink: 0; }
  .runner-info { flex: 1; }
  .runner-info .r-name { font-size: 13.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 5px; }
  .runner-info .r-name .badge { color: var(--green-deep); font-size: 13px; }
  .runner-info .r-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .runner-actions { display: flex; gap: 6px; }
  .runner-actions .r-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; }

  .chat-options { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px; background: white; border-top: 1px solid var(--line); }
  .opt-btn { border: 1.4px solid var(--navy); color: var(--navy); background: white; border-radius: 18px; padding: 8px 13px; font-size: 11.5px; cursor: pointer; transition: all 0.12s ease; }
  .opt-btn:hover { background: var(--navy); color: white; }
  .opt-btn.escalate { border-color: var(--amber); color: var(--amber); }
  .opt-btn.escalate:hover { background: var(--amber); color: white; }
  .restart-row { text-align: center; padding: 6px 0 10px; background: white; }
  .restart-row span { font-size: 10px; color: #9AA0AB; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>●●●● Runners</span></div>
    <div class="app-header">
      <div class="logo-dot"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#38E500"/></svg></div>
      <div class="brand"><div class="name">Runners Errands</div><div class="tag">Ikoyi · Victoria Island · Lekki</div></div>
      <div class="zone-pill">Q4 2026 Pilot</div>
    </div>
    <div class="app-body" id="appBody">
      <div class="landing" id="landingScreen"></div>
      <div class="chat-view" id="chatView">
        <div class="chat-topbar">
          <span class="back" onclick="goHome()">&larr;</span>
          <div><div class="title">Runnerbot 3</div><div class="sub">Your AI operations assistant</div></div>
        </div>
        <div class="stage-track" id="stageTrack"></div>
        <div class="lang-row" id="langRow"></div>
        <div class="plain-toggle-row">
          <div class="p-switch" id="plainSwitch" onclick="togglePlain()"><div class="knob"></div></div>
          <span>Plain Language mode</span>
        </div>
        <div class="lang-draft-note" id="langDraftNote">⚠ AI-drafted translation — pending native-speaker &amp; review before real deployment.</div>
        <div class="chat-scroll" id="chatScroll"></div>
        <div class="chat-options" id="chatOptions"></div>
        <div class="restart-row"><span onclick="restart()">Restart demo</span></div>
      </div>
    </div>
  </div>

<script>
// ============ LANDING: CHAT-FIRST ============
document.getElementById('landingScreen').innerHTML = `
  <div class="landing-greet">Hi, I'm Runnerbot 3.<br>What can I help you with today?</div>
  <div class="landing-sub">Describe what you need — I'll figure out the rest.</div>
  <div class="big-input-wrap">
    <textarea class="big-input" id="bigInput" placeholder="Buy groceries for dinner tonight..." rows="2"></textarea>
    <div class="input-actions">
      <div class="mic-btn" title="Voice input (demo)" onclick="micTap()"><svg viewBox="0 0 24 24" fill="none"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" fill="white"/><path d="M19 10v1a7 7 0 01-14 0v-1M12 18v4M8 22h8" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="send-btn" onclick="sendTyped()"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11l18-8-8 18-2-8-8-2z" fill="white"/></svg></div>
    </div>
  </div>
  <div class="examples-label">Try an example</div>
  <div class="examples-scroll" id="examplesScroll"></div>
`;
const examples = [
  ["Buy groceries for dinner tonight", "grocery_start"],
  ["Pick up my prescription", "pharmacy_start"],
  ["Deliver these documents", "business_start"],
  ["Send flowers to my mum", "grocery_start"],
  ["Schedule laundry pickup every Friday", "business_start"],
  ["I forgot my laptop charger at the office", "guests_start"],
  ["Can you combine these errands?", "guests_start"],
  ["I have guests coming Saturday", "guests_start"],
];
document.getElementById('examplesScroll').innerHTML = examples.map(([label, node]) =>
  `<span class="ex-chip" onclick="openChat('${node}', '${label.replace(/'/g, "\\'")}')">${label}</span>`
).join('');
function micTap() { document.getElementById('bigInput').placeholder = "Listening... (voice input is a Stage 1 roadmap feature)"; }
function sendTyped() {
  const val = document.getElementById('bigInput').value.trim();
  if (!val) return;
  openChat('grocery_start', val);
}

// ============ REASONING STAGES (Product Bible Chapter 4) ============
const stages = ["Understand", "Plan", "Bundle", "Estimate", "Dispatch", "Monitor", "Communicate"];
function renderStageTrack(activeIdx) {
  document.getElementById('stageTrack').innerHTML = stages.map((s, i) => {
    let cls = i < activeIdx ? 'done' : (i === activeIdx ? 'active' : '');
    return `<div class="stage-step ${cls}">${s}</div>`;
  }).join('');
}

// ============ EN: full conversation tree ============
const en = {
  start: { stage: 0, bot: ["Got it \u2014 let me work out what you need."],
    options: [ {label:"I need stuff for the week", next:"grocery_start"}, {label:"I have guests coming Saturday", next:"guests_start"}, {label:"Pick up my prescription", next:"pharmacy_start"}, {label:"I run a small business", next:"business_start"} ] },

  grocery_start: { stage: 0, bot: ["On it. Quick one \u2014 full restock, or specific items you already know you need?"],
    options: [ {label:"Full restock, usual stuff", next:"grocery_plan"}, {label:"Just a few specific items", next:"grocery_plan"}, {label:"First time, not sure", next:"grocery_plan"} ] },
  grocery_plan: { stage: 1, bot: ["Here's the plan:"],
    plan: { title: "Execution Plan", items: ["Pick up groceries", "Stop at pharmacy", "Deliver to home"], time: "52 minutes", cost: "\u20a64,600" },
    options: [ {label:"Looks good", next:"grocery_suggestion"}, {label:"What's the price breakdown?", next:"grocery_price"} ] },
  grocery_suggestion: { stage: 2, bot: [], suggestion: "I can save you \u20a6800 by combining this with a nearby errand. You mentioned a prescription earlier \u2014 want me to add a pharmacy stop to this same run?",
    options: [ {label:"Yes, add the pharmacy stop", next:"grocery_multistop"}, {label:"No, just groceries", next:"grocery_price"} ] },
  grocery_multistop: { stage: 2, bot: ["Got it \u2014 \u201cafter the pharmacy, stop at Shoprite\u201d \u2014 updating the plan now."],
    plan: { title: "Execution Plan (updated)", items: ["Pick up prescription", "Stop at Shoprite for groceries", "Deliver to home"], time: "58 minutes", cost: "\u20a65,300" },
    options: [ {label:"Perfect, what's the price?", next:"grocery_price"} ] },
  grocery_price: { stage: 3, bot: ["Here's the full breakdown \u2014 nothing charged until you confirm."],
    price: { title: "Standard Delivery", rows: [["Items (estimated)", "\u20a63,500"], ["Delivery fee", "\u20a61,800"]], total: "\u20a65,300", note: "Estimate \u2014 final total may vary slightly by actual basket cost." },
    options: [ {label:"Go ahead", next:"grocery_confirmed"}, {label:"Can I get it faster?", next:"grocery_priority"}, {label:"Connect me with support", next:"escalate"} ] },
  grocery_priority: { stage: 3, bot: [], suggestion: "Traffic is heavy on this route right now. Leaving in 30 minutes instead of now would actually save about 20 minutes \u2014 want me to schedule it for then, or go immediately anyway?",
    price: { title: "Priority Delivery", rows: [["Items (estimated)", "\u20a63,500"], ["Priority delivery fee", "\u20a63,000"]], total: "\u20a66,500", note: "40\u201360% premium over standard \u2014 reflects real routing cost." },
    options: [ {label:"Wait 30 minutes", next:"grocery_confirmed"}, {label:"Go now anyway", next:"grocery_confirmed"} ] },
  grocery_confirmed: { stage: 4, bot: ["Order confirmed \u2014 dispatching your runner now."],
    timeline: { title: "Live Order Timeline", steps: [["Order Confirmed","2:14 PM",true],["Runner Assigned","2:16 PM",true],["Runner En Route","2:18 PM",true],["Pickup Complete","",false],["On the Way","",false],["Delivered","",false]] },
    map: true,
    runner: { name: "Emeka O.", rating: "4.9", vehicle: "SY-SM E-Bike", verified: true },
    options: [ {label:"See a live status update", next:"grocery_update"}, {label:"Restart the demo", next:"start"} ] },
  grocery_update: { stage: 6, bot: ["Update: your runner's at Shoprite now, running about 10 minutes behind \u2014 one item needed a substitute, so I picked the closest match. Let me know if you'd rather I hadn't."],
    timeline: { title: "Live Order Timeline", steps: [["Order Confirmed","2:14 PM",true],["Runner Assigned","2:16 PM",true],["Runner En Route","2:18 PM",true],["Pickup Complete","2:34 PM",true],["On the Way","2:36 PM",true],["Delivered","",false]] },
    options: [ {label:"That's fine, thanks", next:"end_positive"}, {label:"Connect me with support", next:"escalate"} ] },

  guests_start: { stage: 0, bot: ["Let's get you sorted. A few quick things: how many guests, and are we talking food, drinks, cleaning help, or all of the above?"],
    options: [ {label:"About 8 people, food + drinks", next:"guests_plan"}, {label:"Just need groceries", next:"grocery_start"}, {label:"Need help with everything", next:"guests_plan_full"} ] },
  guests_plan: { stage: 1, bot: ["Here's the plan \u2014 bundled into one route so you're not paying for two separate trips:"],
    plan: { title: "Execution Plan", items: ["Grocery run (food for 8)", "Drinks/beverage stop", "Deliver to home"], time: "1 hr 40 min", cost: "\u20a644,200" },
    options: [ {label:"That works, what's the price?", next:"guests_price"}, {label:"Add cleaning supplies too", next:"guests_plan_full"} ] },
  guests_plan_full: { stage: 1, bot: ["Added \u2014 full plan: food, drinks, and basic cleaning supplies, all bundled into one run."],
    plan: { title: "Execution Plan (full)", items: ["Grocery run (food for 8)", "Drinks/beverage stop", "Cleaning supplies stop", "Deliver to home"], time: "2 hr 05 min", cost: "\u20a651,400" },
    options: [ {label:"Perfect, what's the price?", next:"guests_price"} ] },
  guests_price: { stage: 3, bot: ["One delivery fee for the whole bundle \u2014 not charged per stop."],
    price: { title: "Standard Delivery (bundled)", rows: [["Items (estimated)", "\u20a642,000"], ["Delivery fee (bundled)", "\u20a62,200"]], total: "\u20a644,200", note: "Bundling saves you a second delivery fee versus separate runs." },
    options: [ {label:"Go ahead", next:"guests_confirmed"}, {label:"Connect me with support", next:"escalate"} ] },
  guests_confirmed: { stage: 4, bot: ["Dispatching now \u2014 I'll keep you posted at each stop, not just at the end."],
    timeline: { title: "Live Order Timeline", steps: [["Order Confirmed","Now",true],["Runner Assigned","",false],["Runner En Route","",false],["Pickup Complete","",false],["On the Way","",false],["Delivered","",false]] },
    runner: { name: "Amaka T.", rating: "4.8", vehicle: "SY-SM E-Bike", verified: true },
    options: [ {label:"Restart the demo", next:"start"} ] },

  pharmacy_start: { stage: 0, bot: ["Is this a repeat prescription I can look up, or a new one you'll need to describe?"],
    options: [ {label:"Repeat prescription", next:"pharmacy_plan"}, {label:"New one, I'll describe it", next:"pharmacy_new"} ] },
  pharmacy_plan: { stage: 3, bot: ["Found it \u2014 same as last time."],
    price: { title: "Standard Delivery", rows: [["Prescription (estimated)", "\u20a68,500"], ["Delivery fee", "\u20a61,500"]], total: "\u20a610,000", note: "Estimate \u2014 pharmacy will confirm exact price at pickup." },
    options: [ {label:"Go ahead", next:"pharmacy_confirmed"}, {label:"Connect me with support", next:"escalate"} ] },

// ============ YO / HA / IG \u2014 honest, limited demo ============
const yo = { start: { stage: 0, bot: ["Bawo, Emi ni Runnerbot.", "(Ohun kikọ ni Gẹ̀ẹ́sì ki alaye o le pe deede: kikọ ni kikun ni ede Yoruba wa lori eto ojo iwaju, ti o duro de ayewo lati odo agbeegbe abinibi. A o tesiwaju ni Gẹ̀ẹ́sì tabi Pidgin nisisiyi.)"], note: true,
  options: [ {label:"Continue in English", next:"start", forceLang:"en"}, {label:"Continue in Pidgin", next:"start", forceLang:"pcm"} ] } };
const ha = { start: { stage: 0, bot: ["Sannu, Ni ne Runnerbot.", "(An rubuta wannan a Turanci don tabbatar da daidaito: cikakken abun ciki a harshen Hausa yana cikin shirin gaba, yana jiran bitar masani. Za mu ci gaba da Turanci ko Pidgin yanzu.)"], note: true,
  options: [ {label:"Continue in English", next:"start", forceLang:"en"}, {label:"Continue in Pidgin", next:"start", forceLang:"pcm"} ] } };
const ig = { start: { stage: 0, bot: ["Ndewo, Abụ m Runnerbot.", "(E dere nke a n'Bekee ka amara ihe ziri ezi: mmemme zuru oke n'asụsụ Igbo dị na atụmatụ ọdịnihu, na-eche nyocha site n'aka ndị amamihe. Anyị ga-aga n'ihu na Bekee ma ọ bụ Pidgin ugbu a.)"], note: true,
  options: [ {label:"Continue in English", next:"start", forceLang:"en"}, {label:"Continue in Pidgin", next:"start", forceLang:"pcm"} ] } };

const content = { en, pcm, yo, ha, ig };
const langLabels = { en: "EN", pcm: "Pidgin", yo: "Yor\u00f9b\u00e1", ha: "Hausa", ig: "Igbo" };

let currentLang = "en";
let plainMode = false;
const scroll = document.getElementById("chatScroll");
const optionsEl = document.getElementById("chatOptions");

function getNode(id) {
  if (content[currentLang] && content[currentLang][id]) return content[currentLang][id];
  return en[id];
}
function buildLangRow() {
  const row = document.getElementById("langRow");
  row.innerHTML = "";
  Object.keys(langLabels).forEach(code => {
    const b = document.createElement("div");
    b.className = "lang-btn" + (code === currentLang ? " active" : "");
    b.textContent = langLabels[code];
    b.onclick = () => { currentLang = code; buildLangRow(); document.getElementById("langDraftNote").classList.toggle("show", ["yo","ha","ig"].includes(code)); restart(); };
    row.appendChild(b);
  });
  document.getElementById("langDraftNote").classList.toggle("show", ["yo","ha","ig"].includes(currentLang));
}
function togglePlain() {
  plainMode = !plainMode;
  document.getElementById("plainSwitch").classList.toggle("on", plainMode);
}

function openChat(nodeId, userLabel) {
  document.getElementById("chatView").classList.add("open");
  document.getElementById("landingScreen").style.display = "none";
  buildLangRow();
  scroll.innerHTML = "";
  renderNode(nodeId, false);
}
function goHome() {
  document.getElementById("chatView").classList.remove("open");
  document.getElementById("landingScreen").style.display = "flex";
}
function restart() {
  currentLang = "en"; plainMode = false;
  buildLangRow();
  document.getElementById("plainSwitch").classList.remove("on");
  scroll.innerHTML = "";
  renderNode("start", false);
}

function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  scroll.appendChild(d);
  scroll.scrollTop = scroll.scrollHeight;
}
function addSuggestion(text) {
  const d = document.createElement("div");
  d.className = "suggestion-card";
  d.innerHTML = '<span class="sg-icon">\u{1F4A1}</span><span class="sg-text">' + text + '</span>';
  scroll.appendChild(d);
  scroll.scrollTop = scroll.scrollHeight;
}
function addPlanCard(p) {
  const d = document.createElement("div");
  d.className = "plan-card";
  let html = '<div class="pl-title">' + p.title + '</div>';
  p.items.forEach(item => { html += '<div class="pl-item"><span class="ck">\u2713</span><span>' + item + '</span></div>'; });
  html += '<div class="pl-meta"><div class="pl-meta-item"><div class="k">Estimated Time</div><div class="v">' + p.time + '</div></div><div class="pl-meta-item"><div class="k">Estimated Cost</div><div class="v">' + p.cost + '</div></div></div>';
  d.innerHTML = html;
  scroll.appendChild(d);
  scroll.scrollTop = scroll.scrollHeight;
}
function addPriceCard(p) {
  const d = document.createElement("div");
  d.className = "price-card";
  let html = '<div class="pc-title">' + p.title + '</div>';
  p.rows.forEach(([label, val]) => { html += '<div class="pc-row"><span>' + label + '</span><span>' + val + '</span></div>'; });
  html += '<div class="pc-total"><span>Total</span><span>' + p.total + '</span></div>';
  html += '<div class="pc-note">' + p.note + '</div>';
  d.innerHTML = html;
  scroll.appendChild(d);
  scroll.scrollTop = scroll.scrollHeight;
}
function addTimelineCard(t) {
  const d = document.createElement("div");
  d.className = "timeline-card";
  let html = '<div class="tl-title">' + t.title + '</div>';
  t.steps.forEach(([label, time, done], i) => {
    const isActive = done && (i === t.steps.filter(s=>s[2]).length - 1);
    html += '<div class="tl-row ' + (done ? 'done' : '') + (isActive ? ' active' : '') + '"><div class="tl-dot"></div><div class="tl-content"><div class="tl-label">' + label + '</div>' + (time ? '<div class="tl-time">' + time + '</div>' : '') + '</div></div>';
  });
  d.innerHTML = html;
  scroll.appendChild(d);
  scroll.scrollTop = scroll.scrollHeight;
}
function addMapCard() {
  const d = document.createElement("div");
  d.className = "map-card";
  d.innerHTML = '<div class="map-label">Live Map</div><div class="eta">ETA 24 min</div>' +
    '<svg viewBox="0 0 360 160" width="100%" height="140"><rect width="360" height="160" fill="#EEF1F6"/>' +
    '<path d="M20 130 Q 100 40 180 80 T 340 30" stroke="#0A2A97" stroke-width="3" fill="none" stroke-dasharray="6,5"/>' +
    '<circle cx="20" cy="130" r="7" fill="#38E500"/><circle cx="340" cy="30" r="7" fill="#0A2A97"/>' +
    '<circle cx="180" cy="80" r="9" fill="#0A2A97"><animate attributeName="r" values="7;11;7" dur="1.6s" repeatCount="indefinite"/></circle>' +
    '</svg>';
  scroll.appendChild(d);
  scroll.scrollTop = scroll.scrollHeight;
}
function addRunnerCard(r) {
  const d = document.createElement("div");
  d.className = "runner-card";
  const initials = r.name.split(' ').map(w=>w[0]).join('');
  d.innerHTML = '<div class="runner-avatar">' + initials + '</div>' +
    '<div class="runner-info"><div class="r-name">' + r.name + (r.verified ? ' <span class="badge">\u2713</span>' : '') + '</div><div class="r-meta">\u2605 ' + r.rating + ' \u00b7 ' + r.vehicle + '</div></div>' +
    '<div class="runner-actions"><div class="r-btn">\u{1F4DE}</div><div class="r-btn">\u{1F4AC}</div></div>';
  scroll.appendChild(d);
  scroll.scrollTop = scroll.scrollHeight;
}
function addTyping() {
  const d = document.createElement("div");
  d.className = "msg bot typing"; d.id = "typingDot";
  d.innerHTML = "<span></span><span></span><span></span>";
  scroll.appendChild(d); scroll.scrollTop = scroll.scrollHeight;
}
function removeTyping() { const t = document.getElementById("typingDot"); if (t) t.remove(); }

function renderNode(nodeId, showUserMsg, userLabel) {
  const node = getNode(nodeId);
  if (showUserMsg) addMsg(userLabel, "user");
  optionsEl.innerHTML = "";
  renderStageTrack(node.stage);
  addTyping();
  setTimeout(() => {
    removeTyping();
    (node.bot || []).forEach(line => addMsg(line, "bot"));
    if (node.suggestion) addSuggestion(node.suggestion);
    if (node.plan) addPlanCard(node.plan);
    if (node.price) addPriceCard(node.price);
    if (node.timeline) addTimelineCard(node.timeline);
    if (node.map) addMapCard();
    if (node.runner) addRunnerCard(node.runner);
    node.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "opt-btn" + (opt.next === "escalate" ? " escalate" : "");
      btn.textContent = opt.label;
      btn.onclick = () => {
        if (opt.forceLang) { currentLang = opt.forceLang; buildLangRow(); }
        renderNode(opt.next, true, opt.label);
      };
      optionsEl.appendChild(btn);
    });
  }, 500);
}
</script>
